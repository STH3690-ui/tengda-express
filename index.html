<section id="auth" class="panel hidden"><h2>腾达快递站 · 账户登录</h2><form id="loginForm"><label>用户名或邮箱</label><input name="email" type="email" required autocomplete="username"><label>密码</label><input name="password" type="password" required autocomplete="current-password"><p><button class="primary">登录</button></p></form><button class="secondary" type="button" onclick="toggleRegister()">创建账户</button><form id="registerForm" class="hidden"><h2>创建账户</h2><label>姓名</label><input name="display_name" required maxlength="60"><label>邮箱</label><input name="email" type="email" required autocomplete="email"><label>密码（至少6位）</label><input name="password" type="password" minlength="6" required autocomplete="new-password"><p><button class="primary">提交申请</button></p><p class="muted">账户创建后需经管理员批准。</p></form></section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
let db=null,user=null,role='',data={td_customers:[],td_orders:[],td_parcels:[],td_pickups:[],td_payments:[],td_members:[]},page='dashboard',queryCustomer='',queryTerm='',queryStatus='pending',signature='',deletionLogs=[],deletionError='',pickupCustomer='',pickupSelected={},pickupBatches=[],archivedCustomers=new Set(),editingCustomerId=null ;
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=x=>Number(x||0).toLocaleString('en-US',{maximumFractionDigits:2}),date=x=>x?new Date(x).toLocaleString('zh-CN'):'';
const name=id=>data.td_customers.find(x=>x.id===id)?.name||'未知客户';const opt=(items,fn)=>items.filter(x=>!x.deleted_at&&!archivedCustomers.has(x.id)).map(x=>`<option value="${esc(x.id)}">${esc(fn(x))}</option>`).join('');
function notify(s,err=false){$('msg').textContent=s;$('msg').classList.remove('hidden');$('msg').style.background=err?'#ffe8e8':'#fff4cf';window.scrollTo({top:0,behavior:'smooth'});}
const TD_SUPABASE_URL='https://yvsgawbbnyeyvynwghsc.supabase.co';
const TD_SUPABASE_PUBLISHABLE_KEY='sb_publishable_olGZexHf-mjgPzQ6Bz7X9w_Idr2L6Hu';
async function connect(){
 if(!window.supabase){notify('无法加载登录服务，请检查网络后刷新。',true);return;}
 db=window.supabase.createClient(TD_SUPABASE_URL,TD_SUPABASE_PUBLISHABLE_KEY,{
  auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
 });
 const {data:{session},error}=await db.auth.getSession();
 if(error)notify('会话检查失败：'+error.message,true);
 if(session){user=session.user;await enter();}else $('auth').classList.remove('hidden');
}
function toggleRegister(){$('registerForm').classList.toggle('hidden')}
$('registerForm').addEventListener('submit',async e=>{e.preventDefault();const btn=e.target.querySelector('button');btn.disabled=true;try{const f=new FormData(e.target);const {data:d,error}=await db.auth.signUp({email:String(f.get('email')).trim(),password:String(f.get('password')),options:{data:{display_name:String(f.get('display_name')).trim()}}});if(error)throw error;notify('申请成功，待批准');e.target.reset();e.target.classList.add('hidden');if(d.session){await db.auth.signOut();user=null;}}catch(err){notify('创建账户失败：'+err.message,true)}finally{btn.disabled=false}});
$('loginForm').addEventListener('submit' ,async e=>{
 e.preventDefault();
 const btn=e.target.querySelector('button');
 const f=new FormData(e.target);
 btn.disabled=true;btn.textContent='正在登录…';
 const timeout=new Promise((_,reject)=>setTimeout(()=>reject(new Error('连接超时（15秒）：请检查网络是否可以访问 Supabase')),15000));
 try{
  if(!db)throw new Error('登录服务尚未连接，请刷新页面重试');
  const {data:d,error}=await Promise.race([db.auth.signInWithPassword({email:String(f.get('email')).trim(),password:f.get('password')}),timeout]);
  if(error)throw error;
  if(!d?.user)throw new Error('登录未返回用户信息');
  user=d.user;
  await Promise.race([enter(),new Promise((_,reject)=>setTimeout(()=>reject(new Error('登录后读取权限超时，请检查 td_members 表和网络')),15000))]);
 }catch(err){notify('登录失败：'+(err?.message||String(err)),true);$('auth').classList.remove('hidden');}
 finally{btn.disabled=false;btn.textContent='登录';}
});
async function enter(){let {data:m,error}=await db.from('td_members').select('role,active,display_name').eq('id',user.id).maybeSingle();if(error||!m||!m.active){await db.auth.signOut();user=null;return notify('账号尚未获批准或已停用，请联系管理员。'+(error?' '+error.message:''),true)}role=m.role;$('who').textContent=`${m.display_name||user.email} · 云端在线`;$('auth').classList.add('hidden');$('app').classList.remove('hidden');await refresh();}
async function logout(){await db.auth.signOut();location.reload()}
async function refresh(){try{for(let t of Object.keys(data)){let q=db.from(t).select('*').order('created_at',{ascending:false}).limit(1000);if(t==='td_parcels')q=db.from(t).select('*').order('arrived_at',{ascending:false}).limit(1000);if(t==='td_pickups')q=db.from(t).select('*').order('picked_at',{ascending:false}).limit(1000);let {data:d,error}=await q;if(error)throw new Error(t+': '+error.message);data[t]=d||[]}const ar=await db.from('td_customer_archives').select('customer_id');if(ar.error)throw new Error('V2.9 客户归档: '+ar.error.message);archivedCustomers=new Set((ar.data||[]).map(x=>x.customer_id));render()}catch(e){notify('读取失败：'+e.message+'。请确认已运行 setup.sql。',true)}}
const tabs=[['dashboard','总览'],['customers','客户'],['orders','代买代付'],['parcels','包裹入库'],['query','客户包裹查询'],['pickups','取件'],['payments','收付款'],['records','记录查询'],['deletions','删除历史'],['staff','账号管理']];
function render(){let list=tabs.filter(x=>!['staff','deletions'].includes(x[0])||role==='owner');$('nav').innerHTML=list.map(x=>`<button class="${page===x[0]?'active':''}" onclick="page='${x[0]}';render()">${x[1]}</button>`).join('');$('page').innerHTML=({dashboard:dashboard,customers:customers,orders:orders,parcels:parcels,query:parcelQuery,pickups:pickups,payments:payments,records:records,deletions:deletions,staff:staff})[page]();if(page==='pickups'){loadPickupBatches();tdLoadDebts();}if(page==='query'){renderQueryResults();}if(page==='records')filterRecords();if(page==='deletions')loadDeletionLogs();}
function dashboard(){let ps=data.td_parcels,os=data.td_orders,buy=os.filter(x=>orderType(x)==='代买'),pay=os.filter(x=>orderType(x)==='代付'),other=os.filter(x=>orderType(x)==='未分类');const sum=a=>a.reduce((n,x)=>n+Number(x.total_price||0),0);return `<h2>业务总览</h2><div class="metrics"><div class="metric">客户数<b>${data.td_customers.filter(x=>!x.deleted_at).length}</b></div><div class="metric">未取包裹<b>${ps.filter(x=>x.remaining>0).length}</b></div><div class="metric">待取件数<b>${ps.reduce((a,x)=>a+Number(x.remaining),0)}</b></div><div class="metric">代买订单<b>${buy.length}</b></div><div class="metric">代付订单<b>${pay.length}</b></div><div class="metric">代买总金额 (MMK)<b>${money(sum(buy))}</b></div><div class="metric">代付总金额 (MMK)<b>${money(sum(pay))}</b></div><div class="metric">未分类订单<b>${other.length}</b></div></div><p class="muted">金额为商品总价，并非利润或已收款；仅统计最近1000条记录。</p>${listParcels(ps.filter(x=>x.remaining>0).slice(0,12))}`}
function customers(){const live=data.td_customers.filter(x=>!x.deleted_at),active=live.filter(x=>!archivedCustomers.has(x.id)),archived=live.filter(x=>archivedCustomers.has(x.id));const row=(x,isArchived)=>`<tr><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${esc(x.notes)}</td><td>${isArchived?'已归档':'正常'}</td><td><button class="secondary" onclick="editCustomer('${x.id}')">修改</button> <button class="secondary danger" onclick="softDeleteCustomer('${x.id}')">删除</button> ${role==='owner'?(isArchived?`<button class="secondary" onclick="manageCustomer('restore','${x.id}')">取消归档</button>`:`<button class="secondary" onclick="manageCustomer('archive','${x.id}')">归档</button>`):''}</td></tr>`;return `<h2>客户登记</h2><form id="customerForm" onsubmit="saveCustomer(event)"><div class="grid"><div><label>客户姓名 *</label><input name="name" required maxlength="120"></div><div><label>电话</label><input name="phone" type="tel"></div></div><label>备注</label><input name="notes"><p><button class="primary" id="customerSave">保存客户</button> <button class="secondary hidden" type="button" id="customerCancel" onclick="cancelCustomerEdit()">取消修改</button></p></form><h2>客户列表（正常 ${active.length} / 已归档 ${archived.length}）</h2><p class="muted">授权账号可添加、修改及删除客户；删除进入回收站，不影响历史订单。仅管理员可恢复已删除客户。</p><div class="scroll"><table><tr><th>姓名</th><th>电话</th><th>备注</th><th>状态</th><th>管理</th></tr>${active.map(x=>row(x,false)).join('')}${archived.map(x=>row(x,true)).join('')}</table></div>${role==='owner'?`<h2>客户回收站</h2><p class="muted">仅管理员可查看和恢复。不会永久删除客户或关联业务记录。</p><div class="scroll"><table><tr><th>客户</th><th>电话</th><th>删除时间</th><th>操作</th></tr>${data.td_customers.filter(x=>x.deleted_at).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${esc(date(x.deleted_at))}</td><td><button class="secondary" onclick="restoreDeletedCustomer('${x.id}')">恢复</button></td></tr>`).join('')}</table></div>`:''}`}
function editCustomer(id){const x=data.td_customers.find(c=>c.id===id&&!c.deleted_at);if(!x)return notify('客户不存在或已删除',true);editingCustomerId=id;const f=$('customerForm');f.elements.name.value=x.name||'';f.elements.phone.value=x.phone||'';f.elements.notes.value=x.notes||'';$('customerSave').textContent='保存修改';$('customerCancel').classList.remove('hidden');f.scrollIntoView({behavior:'smooth',block:'center'});}
function cancelCustomerEdit(){editingCustomerId=null;const f=$('customerForm');if(f)f.reset();if($('customerSave'))$('customerSave').textContent='保存客户';if($('customerCancel'))$('customerCancel').classList.add('hidden');}
async function saveCustomer(e){e.preventDefault();const f=e.target,btn=f.querySelector('button.primary'),name=f.elements.name.value.trim(),phone=f.elements.phone.value.trim(),notes=f.elements.notes.value.trim();if(!name)return notify('请填写客户姓名',true);btn.disabled=true;try{let error;if(editingCustomerId){({error}=await db.rpc('td_update_customer_v31',{p_customer_id:editingCustomerId,p_name:name,p_phone:phone,p_notes:notes}));}else{({error}=await db.from('td_customers').insert({name,phone,notes,created_by:user.id}));}if(error)throw error;editingCustomerId=null;notify('客户资料已保存');await refresh();}catch(err){notify('保存失败：'+err.message,true)}finally{btn.disabled=false;}}
async function softDeleteCustomer(id){const x=data.td_customers.find(c=>c.id===id&&!c.deleted_at);if(!x)return notify('客户不存在',true);if(!confirm(`将客户「${x.name}」移入回收站？原有订单和记录会保留。`))return;const {error}=await db.rpc('td_soft_delete_customer_v31',{p_customer_id:id});if(error)return notify('删除失败：'+error.message,true);notify('客户已移入回收站');await refresh();}
async function restoreDeletedCustomer(id){if(role!=='owner')return notify('仅管理员可恢复',true);const {error}=await db.rpc('td_restore_customer_v31',{p_customer_id:id});if(error)return notify('恢复失败：'+error.message,true);notify('客户已恢复');await refresh();}
async function manageCustomer(action,id){if(role!=='owner')return notify('仅管理员可操作客户',true);const c=data.td_customers.find(x=>x.id===id);if(!c)return notify('客户不存在',true);const label={archive:'归档',restore:'恢复',delete:'永久删除'}[action];if(!confirm(`确定${label}客户「${c.name}」吗？${action==='delete'?'永久删除无法恢复；存在关联业务记录时系统会拒绝删除。':''}`))return;if(action==='delete'&&!confirm(`再次确认：永久删除「${c.name}」？此操作不可撤销。`))return;const rpc=action==='archive'?'td_owner_archive_customer_v29':action==='restore'?'td_owner_restore_customer_v29':'td_owner_delete_customer_v29';const {error}=await db.rpc(rpc,{p_customer_id:id});if(error)return notify('操作失败：'+error.message+'。请确认已执行 V2.9 SQL。',true);notify(label+'成功');await refresh()}

function orderType(x){return /^\[(代买|代付)\]/.exec(x.notes||'')?.[1]||'未分类'}
function orderNotes(x){return (x.notes||'').replace(/^\[(代买|代付)\]\s*/,'')}
function orders(){return `<h2>代买 / 代付登记</h2><form onsubmit="submitRow(event,'td_orders')"><label>业务类别 *</label><select name="service_kind" required><option value="代买">代买（我们购买并付款）</option><option value="代付">代付（客户下单，我们付款）</option></select><div class="grid"><div><label>客户 *</label><select name="customer_id" required>${opt(data.td_customers,x=>x.name+' '+x.phone)}</select></div><div><label>商品名称 *</label><input name="item_name" required></div><div><label>商品类别</label><select name="category"><option>日用品</option><option>服装</option><option>电子产品</option><option>食品</option><option>其他</option></select></div><div><label>数量 *</label><input name="quantity" type="number" min="0.01" step="0.01" value="1" required></div><div><label>单位</label><select name="unit"><option>件</option><option>个</option><option>公斤</option><option>箱</option></select></div><div><label>单价 (MMK)</label><input name="unit_price" type="number" min="0" step="0.01" value="0"></div><div><label>商品总价 (MMK)</label><input name="total_price" type="number" min="0" step="0.01" value="0"></div><div><label>人民币金额 (CNY)</label><input name="td_cny" type="number" min="0" step="0.01" value="0" oninput="tdCalcOrder(this.form)"></div><div><label>采购汇率 (1 CNY = MMK)</label><input name="td_buy_rate" type="number" min="0" step="0.01" value="0" oninput="tdCalcOrder(this.form)"></div><div><label>客户结算汇率 (1 CNY = MMK)</label><input name="td_sell_rate" type="number" min="0" step="0.01" value="0" oninput="tdCalcOrder(this.form)"></div><div><label>汇率差额参考利润 (MMK)</label><input name="td_fx_profit" readonly value="0"></div><div><label>本站已代付 (MMK)</label><input name="advanced_amount" type="number" min="0" step="0.01" value="0"></div><div><label>服务费 (MMK)</label><input name="service_fee" type="number" min="0" step="0.01" value="0"></div><div><label>状态</label><select name="status"><option>已下单</option><option>采购中</option><option>已发货</option><option>完成</option></select></div></div><p class="muted">代买：利润以服务费为主；代付：参考汇差 = 人民币金额 ×（客户结算汇率 − 采购汇率）。汇率在保存时固定记录。总金额可手动修改。</p><label>备注（颜色、尺码、商品详情）</label><input name="notes"><div class="photo-box"><label>商品图片 / 付款凭证（最多10张）</label><input name="order_photos" type="file" accept="image/*" multiple><p class="muted">可从 iPhone 相册选择多张照片；保存订单后自动上传。客户电话和凭证仅授权账号可查看。</p></div><p><button class="primary">保存代买 / 代付</button></p></form><h2>代买 / 代付订单</h2><label>筛选类别</label><select id="orderFilter" onchange="filterOrderRows()"><option value="">全部</option><option>代买</option><option>代付</option><option>未分类</option></select><div class="scroll"><table><tr><th>类别</th><th>客户</th><th>商品</th><th>数量</th><th>总价</th><th>汇率/利润</th><th>已代付</th><th>状态</th><th>图片</th><th>管理</th></tr>${data.td_orders.map(x=>`<tr data-kind="${esc(orderType(x))}"><td>${esc(orderType(x))}</td><td>${esc(name(x.customer_id))}</td><td>${esc(x.item_name)}</td><td>${esc(x.quantity)} ${esc(x.unit)}</td><td>${money(x.total_price)}</td><td>${tdOrderProfitDisplay(x)}</td><td>${money(x.advanced_amount)}</td><td>${esc(x.status)}</td><td><button class="secondary" onclick="openOrderPhotos('${x.id}')">查看/添加图片</button></td><td>${role==='owner'?`<button class="secondary danger" onclick="deleteOrder('${x.id}')">删除</button>`:'仅管理员'}</td></tr>`).join('')}</table></div><div id="orderPhotoArea"></div>`}
function filterOrderRows(){let kind=$('orderFilter')?.value||'';document.querySelectorAll('tr[data-kind]').forEach(tr=>tr.style.display=(!kind||tr.dataset.kind===kind)?'':'none')}
async function deleteOrder(id){if(role!=='owner')return notify('仅管理员可删除订单',true);let x=data.td_orders.find(v=>v.id===id);if(!x)return notify('订单不存在',true);if(!confirm('确定删除客户「'+name(x.customer_id)+'」的「'+x.item_name+'」订单吗？此操作不可恢复。'))return;const {error}=await db.rpc('td_owner_delete_order',{p_order_id:id});if(error)return notify('删除失败：'+error.message+'。请先运行数据库升级 SQL。',true);notify('订单已删除，操作记录已保存；照片暂不自动清理。');await refresh()}

function parcels(){return `<h2>包裹到站 / 入库</h2><form onsubmit="submitRow(event,'td_parcels')"><div class="grid"><div><label>所属客户 *</label><select name="customer_id" required>${opt(data.td_customers,x=>x.name+' '+x.phone)}</select></div><div><label>关联代购订单（可不选）</label><select name="order_id"><option value="">不关联</option>${opt(data.td_orders,x=>name(x.customer_id)+' - '+x.item_name)}</select></div><div><label>运单号</label><input name="tracking_no"></div><div><label>包裹内容</label><input name="description"></div><div><label>类别</label><input name="category" value="普通包裹"></div><div><label>到站件数 *</label><input name="pieces" type="number" min="1" step="1" required></div><div><label>总重量 (公斤)</label><input name="weight_kg" type="number" min="0" step="0.001" value="0"></div><div><label>每公斤收费 (MMK)</label><input name="fee_per_kg" type="number" min="0" step="0.01" value="0"></div><div><label>每件收费 (MMK)</label><input name="fee_per_piece" type="number" min="0" step="0.01" value="0"></div></div><label>备注</label><input name="notes"><div class="photo-box"><label>包裹照片（可拍照或从相册选择，最多10张）</label><input name="parcel_photos" type="file" accept="image/*" multiple><p class="muted">照片会在包裹入库成功后上传到云端；请等待上传完成。</p></div><p><button class="primary">确认入库</button></p></form>${listParcels(data.td_parcels)}`}
function fmtArrived(v){if(!v)return '未记录';const d=new Date(v);return Number.isNaN(d.getTime())?esc(String(v)):esc(d.toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}));}
function listParcels(ps){return `<h2>包裹清单</h2><div class="scroll"><table><tr><th>客户</th><th>运单/内容</th><th>入库时间</th><th>件数</th><th>剩余</th><th>重量</th><th>运费参考</th><th>照片</th></tr>${ps.map(x=>`<tr><td>${esc(name(x.customer_id))}</td><td>${esc(x.tracking_no)}<br>${esc(x.description)}</td><td>${fmtArrived(x.arrived_at)}</td><td>${x.pieces}</td><td><b>${x.remaining}</b></td><td>${x.weight_kg} kg</td><td>${money(Number(x.weight_kg)*Number(x.fee_per_kg)+Number(x.pieces)*Number(x.fee_per_piece))}</td><td><button class="secondary" onclick="openPhotos('${x.id}')">查看/添加照片</button></td></tr>`).join('')}</table></div><div id="photoArea"></div>`}
function parcelQuery(){return `<h2>客户包裹查询</h2><p class="muted">自动关联包裹入库与取件记录。查询只读，不会出库或收款。</p><label>搜索姓名 / 电话 / 地址</label><input id="queryTerm" placeholder="输入客户姓名、电话或地址" value="${esc(queryTerm)}" oninput="queryTerm=this.value;renderQueryResults()"><div id="queryResults"></div>`}
function renderQueryResults(){const box=$('queryResults');if(!box)return;const q=(queryTerm||'').trim().toLowerCase();if(!q){box.innerHTML='<p class="muted">请输入客户资料，查看待取和已取包裹。</p>';return;}const matches=data.td_customers.filter(c=>!c.deleted_at&&[c.name,c.phone,c.address].some(v=>String(v||'').toLowerCase().includes(q)));if(!matches.length){box.innerHTML='<p class="muted">没有找到符合条件的客户。</p>';return;}if(!matches.some(c=>c.id===queryCustomer))queryCustomer=matches[0].id;let c=data.td_customers.find(c=>c.id===queryCustomer),ps=data.td_parcels.filter(p=>p.customer_id===queryCustomer),pending=ps.reduce((a,p)=>a+Math.max(0,Number(p.remaining)||0),0),taken=ps.reduce((a,p)=>a+Math.max(0,(Number(p.pieces)||0)-(Number(p.remaining)||0)),0),pendingWeight=ps.reduce((a,p)=>{let total=Number(p.pieces)||0;return a+(total>0?(Number(p.weight_kg)||0)*Math.max(0,Number(p.remaining)||0)/total:0)},0),estimated=ps.reduce((a,p)=>{let total=Number(p.pieces)||0,remain=Math.max(0,Number(p.remaining)||0),share=total>0?remain/total:0;return a+share*((Number(p.weight_kg)||0)*(Number(p.fee_per_kg)||0)+total*(Number(p.fee_per_piece)||0))},0);let visible=ps.filter(p=>queryStatus==='all'||(queryStatus==='pending'?Number(p.remaining)>0:Number(p.pieces)>Number(p.remaining)));box.innerHTML=`<label>匹配客户（同名请核对电话）</label><select onchange="queryCustomer=this.value;renderQueryResults()">${matches.map(x=>`<option value="${esc(x.id)}" ${x.id===queryCustomer?'selected':''}>${esc(x.name)} / ${esc(x.phone||'无电话')} / ${esc(x.address||'无地址')}</option>`).join('')}</select><div class="metrics"><div class="metric">待取<b>${pending} 件</b></div><div class="metric">已取<b>${taken} 件</b></div><div class="metric">总计<b>${pending+taken} 件</b></div><div class="metric">待取参考重量<b>${money(pendingWeight)} Kg</b></div><div class="metric">待取参考运费<b>${money(estimated)} MMK</b></div></div><p class="muted">按入库登记重量和单价估算。多件合称、部分取件时，剩余重量和费用仅为按件均摊的参考值；实际运费以取件结算记录为准。</p><div class="grid"><button class="${queryStatus==='pending'?'primary':'secondary'}" onclick="queryStatus='pending';renderQueryResults()">待取</button><button class="${queryStatus==='taken'?'primary':'secondary'}" onclick="queryStatus='taken';renderQueryResults()">已取</button><button class="${queryStatus==='all'?'primary':'secondary'}" onclick="queryStatus='all';renderQueryResults()">全部</button></div><div class="scroll"><table><tr><th>类别 / 内容</th><th>运单号</th><th>入库时间</th><th>入库</th><th>待取</th><th>已取</th><th>登记重量</th><th>状态</th></tr>${visible.map(p=>{let r=Math.max(0,Number(p.remaining)||0),t=Math.max(0,(Number(p.pieces)||0)-r);return `<tr><td>${esc(p.category||'普通包裹')}<br>${esc(p.description||'')}</td><td>${esc(p.tracking_no||'—')}</td><td>${fmtArrived(p.arrived_at)}</td><td>${esc(p.pieces)}</td><td>${r}</td><td>${t}</td><td>${money(p.weight_kg)} Kg</td><td>${r===0?'已取':t>0?'部分已取':'待取'}</td></tr>`}).join('')}</table></div>${visible.length?'':'<p class="muted">此状态下暂无包裹。</p>'}<h3>该客户取件历史</h3>${pickupHistoryForCustomer(queryCustomer)}`;}
function pickupHistoryForCustomer(id){let parcelIds=new Set(data.td_parcels.filter(p=>p.customer_id===id).map(p=>p.id));let rows=data.td_pickups.filter(p=>parcelIds.has(p.parcel_id));return rows.length?`<div class="scroll"><table><tr><th>取件时间</th><th>包裹</th><th>数量</th><th>领取人</th></tr>${rows.map(r=>{let p=data.td_parcels.find(p=>p.id===r.parcel_id);return `<tr><td>${esc(date(r.picked_at))}</td><td>${esc(p?.description||p?.tracking_no||'包裹')}</td><td>${esc(r.pieces)} 件</td><td>${esc(r.receiver_name)}</td></tr>`}).join('')}</table></div><p class="muted">实际运费请在「取件」结算历史查看；同一结算单可能包含多件包裹。</p>`:'<p class="muted">暂无取件记录。</p>'}
function pickups(){let customers=data.td_customers.filter(x=>!x.deleted_at&&!archivedCustomers.has(x.id)), current=pickupCustomer||customers[0]?.id||'';pickupCustomer=current;let ps=data.td_parcels.filter(x=>x.customer_id===current&&Number(x.remaining)>0);let selected=ps.filter(x=>pickupSelected[x.id]);let pieces=selected.reduce((n,x)=>n+Number(pickupSelected[x.id]||0),0);return `<h2>客户关联 · 统一称重取件</h2><p class="muted">选择客户后自动列出待取包裹；只勾选本次取走的包裹。所有选中包裹统一称重，商品代付款不计入运输费。</p><label>选择客户 / 搜索姓名或电话</label><input id="pickupSearch" placeholder="搜索客户姓名、电话或地址" oninput="filterPickupCustomers()"><select id="pickupCustomer" onchange="changePickupCustomer(this.value)">${opt(customers,x=>x.name+' / '+(x.phone||''))}</select><div id="pickupParcels"></div><div class="grid"><div><label>本次统一称重（Kg）*</label><input id="pickupKg" type="number" min="0.001" step="0.001" oninput="calcPickup()" placeholder="称重后填写"></div><div><label>每 Kg 运费（MMK）*</label><input id="pickupRate" type="number" min="0" step="0.01" value="7000" oninput="calcPickup()"></div><div><label>本次实收金额 (MMK) *</label><input id="pickupPaid" type="number" min="0" step="0.01" value="0" oninput="calcPickup()"><p class="muted">0 = 全部赊账；小于应收 = 自动欠款；等于应收 = 全额付清</p></div><div><label>收款方式</label><select id="pickupMethod" onchange="calcPickup()"><option>现金</option><option>KBZ Pay</option><option>AYA Pay</option><option>Wave Pay</option><option>银行转账</option><option>赊账</option></select></div><div><label>取件人姓名 *</label><input id="pickupReceiver" value="${esc(customers.find(x=>x.id===current)?.name||'')}"></div><div><label>取件人电话</label><input id="pickupPhone" value="${esc(customers.find(x=>x.id===current)?.phone||'')}"></div></div><label>备注</label><input id="pickupNotes"><div class="metric"><span>本次取件 <b id="pickupCount">0 件</b></span><span>应收运输费 <b id="pickupTotal">0 MMK</b></span><span>本次欠款 <b id="pickupDue">0 MMK</b></span></div><p><button class="primary" id="pickupSubmit" onclick="submitBatchPickup()">确认取件并记录运输费</button></p><p class="muted">需要数据库 V3.2 取件函数。部分付款自动形成欠款；取件和还款不得重复计算收入。一次确认由数据库原子扣减，避免重复出库。</p><h2>欠款与分次还款</h2><p class="muted">欠款记录读取数据库实际余额。每次还款应单独入账。</p><div id="tdDebts">加载中…</div><h2>最近统一取件结算</h2><div id="pickupHistory">加载中…</div>`}
function filterPickupCustomers(){let q=($('pickupSearch')?.value||'').trim().toLowerCase();let options=data.td_customers.filter(x=>!x.deleted_at&&!archivedCustomers.has(x.id)&&(x.name+' '+(x.phone||'')+' '+(x.address||'')).toLowerCase().includes(q));let sel=$('pickupCustomer');sel.innerHTML=opt(options,x=>x.name+' / '+(x.phone||''));if(options.length){sel.value=options.some(x=>x.id===pickupCustomer)?pickupCustomer:options[0].id;changePickupCustomer(sel.value)}else{$('pickupParcels').innerHTML='没有找到客户'}}
function changePickupCustomer(id){pickupCustomer=id;pickupSelected={};let c=data.td_customers.find(x=>x.id===id);if($('pickupReceiver'))$('pickupReceiver').value=c?.name||'';if($('pickupPhone'))$('pickupPhone').value=c?.phone||'';renderPickupParcels()}
function renderPickupParcels(){let ps=data.td_parcels.filter(x=>x.customer_id===pickupCustomer&&Number(x.remaining)>0);$('pickupParcels').innerHTML=ps.length?`<p><b>待取包裹：${ps.length} 条 / ${ps.reduce((n,x)=>n+Number(x.remaining),0)} 件</b></p>${ps.map(x=>`<div class="metric" style="margin:8px 0"><label style="display:flex;gap:10px;align-items:center"><input style="width:20px" type="checkbox" ${pickupSelected[x.id]?'checked':''} onchange="togglePickup('${x.id}',this.checked)"><b>${esc(x.description||x.tracking_no||'包裹')}</b></label><div class="muted">${esc(x.category||'普通包裹')} · 运单 ${esc(x.tracking_no||'无')} · 待取 ${x.remaining} 件</div><label>本次取几件</label><input type="number" min="1" max="${Number(x.remaining)}" step="1" value="${pickupSelected[x.id]||1}" ${pickupSelected[x.id]?'':'disabled'} oninput="setPickupPieces('${x.id}',this.value)"></div>`).join('')}`:'<p class="muted">该客户目前没有待取包裹。</p>';calcPickup()}
function togglePickup(id,checked){pickupSelected[id]=checked?1:0;renderPickupParcels()}
function setPickupPieces(id,v){let x=data.td_parcels.find(p=>p.id===id);pickupSelected[id]=Math.max(1,Math.min(Number(x?.remaining||1),Math.floor(Number(v)||1)));calcPickup()}
function calcPickup(){let ps=data.td_parcels.filter(x=>x.customer_id===pickupCustomer&&pickupSelected[x.id]>0);let pieces=ps.reduce((n,x)=>n+Number(pickupSelected[x.id]),0),kg=Number($('pickupKg')?.value||0),rate=Number($('pickupRate')?.value||0);if($('pickupCount'))$('pickupCount').textContent=pieces+' 件';if($('pickupTotal'))$('pickupTotal').textContent=money(kg*rate)+' MMK';if($('pickupDue'))$('pickupDue').textContent=money(Math.max(0,kg*rate-Number($('pickupPaid')?.value||0)))+' MMK'}
async function loadPickupBatches(){if(page!=='pickups')return;renderPickupParcels();let {data:rows,error}=await db.from('td_pickup_batches').select('*').order('created_at',{ascending:false}).limit(30);if(page!=='pickups')return;let box=$('pickupHistory');if(!box)return;box.innerHTML=error?'<p class="danger">尚未安装 V2.7 数据库升级，请先执行升级 SQL。</p>':(rows?.length?`<div class="scroll"><table><tr><th>时间</th><th>客户</th><th>件数</th><th>总重</th><th>运费</th><th>方式</th></tr>${rows.map(x=>`<tr><td>${date(x.created_at)}</td><td>${esc(name(x.customer_id))}</td><td>${x.total_pieces}</td><td>${x.total_kg} Kg</td><td>${money(x.freight_mmk)}</td><td>${esc(x.payment_method)}</td></tr>`).join('')}</table></div>`:'<p class="muted">暂无统一取件结算记录</p>')}
async function submitBatchPickup(){let selected=data.td_parcels.filter(x=>x.customer_id===pickupCustomer&&pickupSelected[x.id]>0),kg=Number($('pickupKg').value),rate=Number($('pickupRate').value),receiver=$('pickupReceiver').value.trim(),paid=Number($('pickupPaid').value);if(!selected.length)return notify('请先勾选本次取件的包裹',true);if(!Number.isFinite(kg)||kg<=0||!Number.isFinite(rate)||rate<0)return notify('请填写正确的统一重量和单价',true);if(!receiver)return notify('请填写取件人姓名',true);if(!Number.isFinite(paid)||paid<0||paid>kg*rate)return notify('本次实收不能小于0或大于应收金额',true);let items=selected.map(x=>({parcel_id:x.id,pieces:Number(pickupSelected[x.id])}));if(!confirm(`确认取走 ${items.reduce((n,x)=>n+x.pieces,0)} 件，共 ${kg} Kg，应收 ${money(kg*rate)} MMK，实收 ${money(paid)} MMK，欠款 ${money(kg*rate-paid)} MMK？`))return;let btn=$('pickupSubmit');btn.disabled=true;try{let {error}=await db.rpc('td_batch_pickup_v32',{p_customer:pickupCustomer,p_items:items,p_weight:kg,p_rate:rate,p_paid:paid,p_method:paid===0?'赊账':$('pickupMethod').value,p_name:receiver,p_phone:$('pickupPhone').value||'',p_notes:$('pickupNotes').value||''});if(error)throw error;pickupSelected={};notify('统一取件结算成功，包裹剩余数量已同步');await refresh()}catch(e){notify('结算失败：'+e.message,true)}finally{if(btn.isConnected)btn.disabled=false}}
function payments(){return `<h2>收款 / 付款流水</h2><form onsubmit="submitRow(event,'td_payments')"><div class="grid"><div><label>客户 *</label><select name="customer_id" required>${opt(data.td_customers,x=>x.name)}</select></div><div><label>关联代购订单（可选）</label><select name="order_id"><option value="">不关联</option>${opt(data.td_orders,x=>name(x.customer_id)+' / '+x.item_name)}</select></div><div><label>类型</label><select name="direction"><option>收款</option><option>付款</option></select></div><div><label>金额 (MMK) *</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div><label>方式</label><select name="method"><option>现金</option><option>KBZ Pay</option><option>AYA Pay</option><option>Wave Pay</option><option>银行转账</option><option>其他</option></select></div></div><label>备注</label><input name="notes"><p><button class="primary">保存流水</button></p></form><h2>收付款记录</h2><div class="scroll"><table><tr><th>时间</th><th>客户</th><th>类型</th><th>金额</th><th>方式</th></tr>${data.td_payments.map(x=>`<tr><td>${date(x.created_at)}</td><td>${esc(name(x.customer_id))}</td><td>${esc(x.direction)}</td><td>${money(x.amount)}</td><td>${esc(x.method)}</td></tr>`).join('')}</table></div>`}
function records(){return `<h2>记录查询</h2><label>记录类别</label><select id="recordKind" onchange="filterRecords()"><option value="">全部</option><option>代买</option><option>代付</option><option>未分类</option><option>包裹</option><option>取件</option></select><label>搜索客户 / 运单 / 商品 / 取件人</label><input id="search" oninput="filterRecords()" placeholder="输入关键词"><div id="results"></div>`}
function filterRecords(){let q=$('search').value.toLowerCase().trim(),kind=$('recordKind').value,rows=[...data.td_orders.map(x=>({type:orderType(x),who:name(x.customer_id),desc:x.item_name,extra:x.quantity+' '+x.unit})),...data.td_parcels.map(x=>({type:'包裹',who:name(x.customer_id),desc:(x.tracking_no||'')+' '+(x.description||''),extra:'剩余 '+x.remaining+' 件'})),...data.td_pickups.map(x=>({type:'取件',who:x.receiver_name,desc:x.receiver_phone,extra:'取走 '+x.pieces+' 件'}))].filter(x=>(!kind||x.type===kind)&&Object.values(x).join(' ').toLowerCase().includes(q));$('results').innerHTML=`<div class="scroll"><table><tr><th>类型</th><th>姓名</th><th>内容</th><th>数量</th></tr>${rows.slice(0,100).map(x=>`<tr><td>${esc(x.type)}</td><td>${esc(x.who)}</td><td>${esc(x.desc)}</td><td>${esc(x.extra)}</td></tr>`).join('')}</table></div>`}
function deletions(){if(role!=='owner')return '<h2>无权限</h2>';return `<h2>删除历史（仅管理员）</h2><p class="muted">显示最近200条删除操作。已删除订单不会计入总览。历史只读，其他账号不可查看。</p><button class="secondary" onclick="loadDeletionLogs()">刷新删除历史</button><div id="deletionResults"><p class="muted">正在读取删除历史…</p></div>`}
async function loadDeletionLogs(){if(role!=='owner'||page!=='deletions')return;const box=$('deletionResults');if(!box)return;box.innerHTML='<p class="muted">正在读取删除历史…</p>';const {data:logs,error}=await db.from('td_order_deletion_log').select('id,order_id,deleted_by,deleted_at,snapshot').order('deleted_at',{ascending:false}).limit(200);if(error){box.innerHTML='<p class="danger">读取失败：'+esc(error.message)+'。请在 Supabase SQL Editor 运行 V2.6 数据库升级文件。</p>';return}const rows=logs||[];box.innerHTML=rows.length?`<div class="scroll"><table><tr><th>删除时间</th><th>操作人</th><th>客户</th><th>类别</th><th>商品</th><th>数量</th><th>总金额 (MMK)</th><th>原订单编号</th></tr>${rows.map(log=>{const x=log.snapshot||{};const staff=data.td_members.find(m=>m.id===log.deleted_by);const operator=staff?.display_name||log.deleted_by;return `<tr><td>${esc(date(log.deleted_at))}</td><td>${esc(operator)}</td><td>${esc(name(x.customer_id))}</td><td>${esc(orderType(x))}</td><td>${esc(x.item_name)}</td><td>${esc(x.quantity)} ${esc(x.unit)}</td><td>${money(x.total_price)}</td><td>${esc(log.order_id)}</td></tr>`}).join('')}</table></div>`:'<p class="muted">暂无删除历史。如果以前删除过订单，请确认数据库升级及日志权限配置。</p>'}
function staff(){if(role!=='owner')return '';return `<h2>账户审批</h2><p class="muted">新账户默认待批准。仅管理员可以批准或停用账号；管理员账号不能在这里修改。</p><div class="scroll"><table><tr><th>姓名</th><th>角色</th><th>状态</th><th>操作</th></tr>${data.td_members.map(x=>`<tr><td>${esc(x.display_name||x.id)}</td><td>${x.role==='owner'?'管理员':'普通账号'}</td><td>${x.active?'已启用':'待批准/停用'}</td><td>${x.role==='owner'?'—':`<button class="secondary" onclick="setMemberActive('${x.id}',${!x.active})">${x.active?'停用':'批准'}</button>`}</td></tr>`).join('')}</table></div><button class="secondary" onclick="refresh()">刷新申请列表</button>`}
async function setMemberActive(id,active){if(role!=='owner')return notify('无权限',true);if(!confirm(active?'批准这个账户使用系统？':'停用这个账户？'))return;const {error}=await db.rpc('td_owner_set_member_active_v30',{p_member:id,p_active:active});if(error)return notify('操作失败：'+error.message,true);notify(active?'已批准':'已停用');await refresh()}

async function submitRow(e,t){e.preventDefault();let files=Array.from(e.target.querySelector(t==='td_parcels'?'[name=parcel_photos]':'[name=order_photos]')?.files||[]);if(files.length>10)return notify('每个包裹最多选择10张照片',true);let f=Object.fromEntries(new FormData(e.target));delete f.parcel_photos;delete f.order_photos;if(t==='td_orders'){const cny=Number(f.td_cny||0),br=Number(f.td_buy_rate||0),sr=Number(f.td_sell_rate||0),kind=f.service_kind; if([cny,br,sr].some(x=>!Number.isFinite(x)||x<0))return notify('汇率或人民币金额不正确',true); const fx=(cny*(sr-br)); const snapshot='[FXV32:CNY='+cny+';BUY='+br+';SELL='+sr+';DIFF='+fx.toFixed(2)+']';f.notes='['+kind+'] '+snapshot+' '+(f.notes||'');delete f.service_kind;delete f.td_cny;delete f.td_buy_rate;delete f.td_sell_rate;delete f.td_fx_profit; if(cny>0&&sr>0&&(!f.total_price||Number(f.total_price)===0))f.total_price=(cny*sr).toFixed(2);}for(let k in f)if(f[k]==='')delete f[k];if(t==='td_parcels')f.remaining=Number(f.pieces);if(t==='td_orders'&&(!f.total_price||Number(f.total_price)===0))f.total_price=Number(f.unit_price||0)*Number(f.quantity||0);f.created_by=user.id;let {data:created,error}=await db.from(t).insert(f).select('id').single();if(error)return notify('保存失败：'+error.message,true);if(files.length){notify('记录已保存，正在上传照片，请勿关闭页面');let r=await uploadPhotos(t==='td_orders'?'orders/'+created.id:created.id,files);notify(r)}else notify('已保存到云端');await refresh()}
async function submitPickup(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let {error}=await db.rpc('td_record_pickup',{p_parcel:f.parcel_id,p_pieces:Number(f.pieces),p_name:f.receiver_name,p_phone:f.receiver_phone||'',p_signature:signature,p_notes:f.notes||''});if(error)return notify('出库失败：'+error.message,true);signature='';notify('出库成功，剩余件数已同步');await refresh()}

const PHOTO_BUCKET='tengda-images';
// 订单类别存于原有 notes 字段的前缀，避免修改线上数据库结构。
async function uploadPhotos(parcelId,files){
 if(!user)return '请先登录';
 const {data:existing,error:listError}=await db.storage.from(PHOTO_BUCKET).list(parcelId,{limit:100});
 if(listError)return '读取照片数量失败：'+listError.message;
 const count=(existing||[]).filter(x=>x.name&&!x.name.startsWith('.')).length;
 if(count+files.length>10)return `该包裹已有${count}张照片，最多10张，本次未上传`;
 let ok=0,errors=[];
 for(const file of files){
  if(!file.type.startsWith('image/')){errors.push('跳过非图片文件');continue}
  if(file.size>10*1024*1024){errors.push(file.name+' 超过10MB');continue}
  const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5)||'jpg';
  const id=crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+ok;
  const {error}=await db.storage.from(PHOTO_BUCKET).upload(`${parcelId}/${id}.${ext}`,file,{contentType:file.type,upsert:false});
  if(error)errors.push(error.message);else ok++;
 }
 return `成功上传${ok}张照片`+(errors.length?'；失败：'+errors.join('；'):'');
}
async function openPhotos(parcelId){
 const box=$('photoArea');if(!box)return;
 box.innerHTML='<div class="photo-box">正在加载照片…</div>';
 const {data:files,error}=await db.storage.from(PHOTO_BUCKET).list(parcelId,{limit:100});
 if(error){box.innerHTML='<div class="photo-box">照片读取失败：'+esc(error.message)+'</div>';return}
 const photos=(files||[]).filter(x=>x.name&&!x.name.startsWith('.')).slice(0,10);
 let html='';
 for(const f of photos){const {data:link,error:e}=await db.storage.from(PHOTO_BUCKET).createSignedUrl(`${parcelId}/${f.name}`,3600);if(!e&&link?.signedUrl){const u=link.signedUrl.replace(/&/g,'&amp;').replace(/"/g,'&quot;');html+=`<a href="${u}" target="_blank" rel="noopener"><img src="${u}" alt="包裹照片" loading="lazy"></a>`}}
 box.innerHTML=`<div class="photo-box"><h2>包裹照片（${photos.length}/10）</h2><p class="muted">点击照片可放大查看；链接有效期1小时，过期后重新打开。</p><div class="photo-grid">${html}</div><label>继续添加照片</label><input id="morePhotos" type="file" accept="image/*" multiple ${photos.length>=10?'disabled':''}><button class="primary" onclick="addPhotos('${parcelId}')" ${photos.length>=10?'disabled':''}>上传所选照片</button><p id="photoProgress" class="photo-status"></p></div>`;
 box.scrollIntoView({behavior:'smooth',block:'nearest'});
}
async function addPhotos(parcelId){const files=Array.from($('morePhotos').files||[]);if(!files.length)return notify('请先选择照片',true);$('photoProgress').textContent='正在上传，请勿关闭页面…';const result=await uploadPhotos(parcelId,files);notify(result);await openPhotos(parcelId)}

async function openOrderPhotos(id){const box=$('orderPhotoArea');if(!box)return;box.innerHTML='<div class="photo-box">正在加载图片…</div>';const prefix='orders/'+id;const {data:files,error}=await db.storage.from(PHOTO_BUCKET).list(prefix,{limit:100});if(error){box.innerHTML='<div class="photo-box">图片读取失败：'+esc(error.message)+'</div>';return}const photos=(files||[]).filter(x=>x.name&&!x.name.startsWith('.')).slice(0,10);let html='';for(const f of photos){const {data:link,error:e}=await db.storage.from(PHOTO_BUCKET).createSignedUrl(prefix+'/'+f.name,3600);if(!e&&link?.signedUrl){const u=esc(link.signedUrl);html+=`<a href="${u}" target="_blank" rel="noopener"><img src="${u}" alt="商品图片" loading="lazy"></a>`}}box.innerHTML=`<div class="photo-box"><h2>商品图片（${photos.length}/10）</h2><p class="muted">点击图片放大查看；链接有效期1小时。</p><div class="photo-grid">${html}</div><label>追加商品图片</label><input id="moreOrderPhotos" type="file" accept="image/*" multiple ${photos.length>=10?'disabled':''}><button class="primary" onclick="addOrderPhotos('${id}')" ${photos.length>=10?'disabled':''}>上传所选图片</button></div>`;box.scrollIntoView({behavior:'smooth',block:'nearest'})}
async function addOrderPhotos(id){const files=Array.from($('moreOrderPhotos').files||[]);if(!files.length)return notify('请先选择图片',true);notify(await uploadPhotos('orders/'+id,files));await openOrderPhotos(id)}
function initSign(){let c=$('sign');if(!c)return;let r=c.getBoundingClientRect();c.width=Math.max(250,Math.floor(r.width));c.height=130;let ctx=c.getContext('2d');ctx.lineWidth=2.5;ctx.lineCap='round';let down=false,strokes=[],stroke=[];const pt=e=>{let b=c.getBoundingClientRect();return [Math.round((e.clientX-b.left)*c.width/b.width),Math.round((e.clientY-b.top)*c.height/b.height)]};c.onpointerdown=e=>{down=true;stroke=[pt(e)];ctx.beginPath();ctx.moveTo(...stroke[0]);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!down)return;let p=pt(e);stroke.push(p);ctx.lineTo(...p);ctx.stroke()};c.onpointerup=()=>{if(!down)return;down=false;strokes.push(stroke);signature=JSON.stringify(strokes)};}
function clearSign(){signature='';initSign()}

// V3.2 FX: store immutable per-order rate snapshot in the existing notes field.
function tdCalcOrder(f){const c=Number(f.elements.td_cny?.value||0),b=Number(f.elements.td_buy_rate?.value||0),r=Number(f.elements.td_sell_rate?.value||0);if(f.elements.td_fx_profit)f.elements.td_fx_profit.value=(c*(r-b)).toFixed(2);if(f.elements.total_price&&c>0&&r>0)f.elements.total_price.value=(c*r).toFixed(2)}
function tdOrderProfitDisplay(x){const m=String(x.notes||'').match(/\[FXV32:CNY=([\d.]+);BUY=([\d.]+);SELL=([\d.]+);DIFF=([-\d.]+)\]/);if(!m)return '<span class="muted">未登记汇率</span>';const c=Number(m[1]),b=Number(m[2]),r=Number(m[3]),d=Number(m[4]);return '¥'+money(c)+'<br>采购 '+money(b)+' / 结算 '+money(r)+'<br><b>'+(orderType(x)==='代付'?'参考汇差 ':'参考差额 ')+money(d)+' MMK</b>'}

async function tdLoadDebts(){const box=$('tdDebts');if(!box||page!=='pickups')return;const {data:rows,error}=await db.from('td_pickup_batches').select('*').order('created_at',{ascending:false}).limit(200);if(!box.isConnected)return;if(error){box.textContent='欠款读取失败：'+error.message;return;}const a=(rows||[]).filter(x=>Number(x.freight_mmk||0)>0);const hasBalance=a.some(x=>['remaining_due','due_mmk','balance_due','unpaid_mmk','outstanding_mmk'].some(k=>Object.prototype.hasOwnProperty.call(x,k)));if(!hasBalance){box.innerHTML='<p class="muted">数据库当前取件批次未暴露欠款余额字段。请先确认 V3.2 还款台账结构，暂不提供可能重复记账的还款按钮。</p>';return;}const due=x=>Number(x.remaining_due??x.due_mmk??x.balance_due??x.unpaid_mmk??x.outstanding_mmk??0);box.innerHTML='<div class="scroll"><table><tr><th>客户</th><th>取件日期</th><th>应收</th><th>欠款</th></tr>'+a.filter(x=>due(x)>0).map(x=>'<tr><td>'+esc(name(x.customer_id))+'</td><td>'+esc(date(x.created_at))+'</td><td>'+money(x.freight_mmk)+'</td><td><b>'+money(due(x))+'</b></td></tr>').join('')+'</table></div><p class="muted">还款操作需与数据库 td_pickup_repay_v32 的实际参数和账本字段核对后启用，避免误收、重复记账。</p>'}
