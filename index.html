async function tdDiagnose(){

function tdClearSessionView(){user=null;role='';page='dashboard';editingCustomerId=null;pickupSelected={};pickupCustomer='';pickupBatches=[];signature='';archivedCustomers=new Set();deletionLogs=[];for(const t of Object.keys(data))data[t]=[];$('app').classList.add('hidden');$('page').innerHTML='';$('nav').innerHTML='';$('auth').classList.remove('hidden');$('who').textContent='云端业务管理 · 手机 / 电脑';}
async function tdCheckMember(){if(!user)return false;const {data:m,error}=await db.from('td_members').select('role,active,display_name').eq('id',user.id).maybeSingle();if(error||!m?.active){tdClearSessionView();await db.auth.signOut();notify('账号尚未通过审核、已停用或权限检查失败，请联系管理员。',true);return false;}role=m.role;$('who').textContent=`${m.display_name||user.email} · 云端在线`;return true;}
async function enter(){if(!await tdCheckMember())return;$('auth').classList.add('hidden');$('app').classList.remove('hidden');await refresh();}

setInterval(()=>{if(user)tdCheckMember().catch(()=>{tdClearSessionView();});},30000);

async function logout(){await db.auth.signOut();location.reload()}
async function refresh(){try{if(!await tdCheckMember())return;for(let t of Object.keys(data)){let q=db.from(t).select('*').order('created_at',{ascending:false}).limit(1000);if(t==='td_parcels')q=db.from(t).select('*').order('arrived_at',{ascending:false}).limit(1000);if(t==='td_pickups')q=db.from(t).select('*').order('picked_at',{ascending:false}).limit(1000);let {data:d,error}=await q;if(error)throw new Error(t+': '+error.message);data[t]=d||[]}const ar=await db.from('td_customer_archives').select('customer_id');if(ar.error)throw new Error('V2.9 客户归档: '+ar.error.message);archivedCustomers=new Set((ar.data||[]).map(x=>x.customer_id));const hr=await db.from('td_order_hidden_v41').select('order_id');if(hr.error)throw new Error('历史订单隐藏状态: '+hr.error.message);hiddenOrderIds=new Set((hr.data||[]).map(x=>x.order_id));render()}catch(e){notify('读取失败：'+e.message+'。请确认已运行 setup.sql。',true)}}
const tabs=[['dashboard','总览'],['customers','客户'],['orders','代买代付'],['parcels','包裹入库'],['query','客户包裹查询'],['pickups','取件'],['payments','收付款'],['records','记录查询'],['deletions','删除历史'],['staff','账号管理']];
function render(){let list=tabs.filter(x=>!['staff','deletions'].includes(x[0])||role==='owner');$('nav').innerHTML=list.map(x=>`<button class="${page===x[0]?'active':''}" onclick="page='${x[0]}';render()">${x[1]}</button>`).join('');$('page').innerHTML=({dashboard:dashboard,customers:customers,orders:orders,parcels:parcels,query:parcelQuery,pickups:pickups,payments:payments,records:records,deletions:deletions,staff:staff})[page]();if(page==='pickups'){loadPickupBatches();tdLoadDebts();}if(page==='dashboard')tdLoadFinance();if(page==='query'){renderQueryResults();}if(page==='records')filterRecords();if(page==='deletions')loadDeletionLogs();}
function dashboard(){let ps=data.td_parcels,os=data.td_orders.filter(x=>!hiddenOrderIds.has(x.id)),buy=os.filter(x=>orderType(x)==='代买'),pay=os.filter(x=>orderType(x)==='代付'),other=os.filter(x=>orderType(x)==='未分类');const sum=a=>a.reduce((n,x)=>n+Number(x.total_price||0),0);return `<h2>业务总览</h2><div class="metrics"><div class="metric">客户数<b>${data.td_customers.filter(x=>!x.deleted_at).length}</b></div><div class="metric">未取包裹<b>${ps.filter(x=>x.remaining>0).length}</b></div><div class="metric">待取件数<b>${ps.reduce((a,x)=>a+Number(x.remaining),0)}</b></div><div class="metric">代买订单<b>${buy.length}</b></div><div class="metric">代付订单<b>${pay.length}</b></div><div class="metric">代买总金额 (MMK)<b>${money(sum(buy))}</b></div><div class="metric">代付总金额 (MMK)<b>${money(sum(pay))}</b></div><div class="metric">未分类订单<b>${other.length}</b></div></div><p class="muted">金额为商品总价，并非利润或已收款；仅统计最近1000条记录。</p><div id="tdFinance">正在加载快递财务数据…</div>${listParcels(ps.filter(x=>x.remaining>0).slice(0,12))}`}
function customers(){const live=data.td_customers.filter(x=>!x.deleted_at),active=live.filter(x=>!archivedCustomers.has(x.id)),archived=live.filter(x=>archivedCustomers.has(x.id));const row=(x,isArchived)=>`<tr><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${esc(x.notes)}</td><td>${isArchived?'已归档':'正常'}</td><td>${!isArchived||role==='owner'?`<button class="secondary" onclick="editCustomer('${x.id}')">修改</button>`:''} ${role==='owner'?`<button class="secondary danger" onclick="softDeleteCustomer('${x.id}')">删除</button>`:''} ${role==='owner'?(isArchived?`<button class="secondary" onclick="manageCustomer('restore','${x.id}')">取消归档</button>`:`<button class="secondary" onclick="manageCustomer('archive','${x.id}')">归档</button>`):''}</td></tr>`;return `<h2>客户登记</h2><form id="customerForm" onsubmit="saveCustomer(event)"><div class="grid"><div><label>客户姓名 *</label><input name="name" required maxlength="120"></div><div><label>电话</label><input name="phone" type="tel"></div></div><label>备注</label><input name="notes"><p><button class="primary" id="customerSave">保存客户</button> <button class="secondary hidden" type="button" id="customerCancel" onclick="cancelCustomerEdit()">取消修改</button></p></form><h2>客户列表（正常 ${active.length} / 已归档 ${archived.length}）</h2><p class="muted">账号可新增、修改客户；仅管理员可删除、恢复或归档客户。删除进入回收站，不影响历史订单。</p><div class="scroll"><table><tr><th>姓名</th><th>电话</th><th>备注</th><th>状态</th><th>管理</th></tr>${active.map(x=>row(x,false)).join('')}${archived.map(x=>row(x,true)).join('')}</table></div>${role==='owner'?`<h2>客户回收站</h2><p class="muted">仅管理员可查看和恢复。不会永久删除客户或关联业务记录。</p><div class="scroll"><table><tr><th>客户</th><th>电话</th><th>删除时间</th><th>操作</th></tr>${data.td_customers.filter(x=>x.deleted_at).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${esc(date(x.deleted_at))}</td><td><button class="secondary" onclick="restoreDeletedCustomer('${x.id}')">恢复</button></td></tr>`).join('')}</table></div>`:''}`}
function editCustomer(id){const x=data.td_customers.find(c=>c.id===id&&!c.deleted_at);if(!x)return notify('客户不存在或已删除',true);if(role!=='owner'&&archivedCustomers.has(id))return notify('仅管理员可修改已归档客户',true);editingCustomerId=id;const f=$('customerForm');f.elements.name.value=x.name||'';f.elements.phone.value=x.phone||'';f.elements.notes.value=x.notes||'';$('customerSave').textContent='保存修改';$('customerCancel').classList.remove('hidden');f.scrollIntoView({behavior:'smooth',block:'center'});}

async function saveCustomer(e){e.preventDefault();const f=e.target,btn=f.querySelector('button.primary'),name=f.elements.name.value.trim(),phone=f.elements.phone.value.trim(),notes=f.elements.notes.value.trim();if(!name)return notify('请填写客户姓名',true);btn.disabled=true;try{let error;if(editingCustomerId){({error}=await db.from('td_customers').update({name,phone,notes}).eq('id',editingCustomerId).select('id').single());}else{({error}=await db.from('td_customers').insert({name,phone,notes,created_by:user.id}));}if(error)throw error;editingCustomerId=null;notify('客户资料已保存');await refresh();}catch(err){notify('保存失败：'+err.message,true)}finally{btn.disabled=false;}}

async function manageCustomer(action,id){if(role!=='owner')return notify('仅管理员可操作客户',true);const c=data.td_customers.find(x=>x.id===id);if(!c)return notify('客户不存在',true);const label={archive:'归档',restore:'恢复',delete:'永久删除'}[action];if(!confirm(`确定${label}客户「${c.name}」吗？${action==='delete'?'永久删除无法恢复；存在关联业务记录时系统会拒绝删除。':''}`))return;if(action==='delete'&&!confirm(`再次确认：永久删除「${c.name}」？此操作不可撤销。`))return;const rpc=action==='archive'?'td_owner_archive_customer_v29':action==='restore'?'td_owner_restore_customer_v29':'td_owner_delete_customer_v29';const {error}=await db.rpc(rpc,{p_customer_id:id});if(error)return notify('操作失败：'+error.message+'。请确认已执行 V2.9 SQL。',true);notify(label+'成功');await refresh()}

function orderType(x){return /^\[(代买|代付)\]/.exec(x.notes||'')?.[1]||'未分类'}
function orderNotes(x){return (x.notes||'').replace(/^\[(代买|代付)\]\s*/,'')}
function orders(){return `<h2>代买 / 代付登记</h2><form onsubmit="submitRow(event,'td_orders')"><label>业务类别 *</label><select name="service_kind" required><option value="代买">代买（我们购买并付款）</option><option value="代付">代付（客户下单，我们付款）</option></select><div class="grid"><div><label>客户 *</label><select name="customer_id" required>${opt(data.td_customers,x=>x.name+' '+x.phone)}</select></div><div><label>商品名称 *</label><input name="item_name" required></div><div><label>商品类别</label><select name="category"><option>日用品</option><option>服装</option><option>电子产品</option><option>食品</option><option>其他</option></select></div><div><label>数量 *</label><input name="quantity" type="number" min="0.01" step="0.01" value="1" required></div><div><label>单位</label><select name="unit"><option>件</option><option>个</option><option>公斤</option><option>箱</option></select></div><div><label>单价 (MMK)</label><input name="unit_price" type="number" min="0" step="0.01" value="0"></div><div><label>商品总价 (MMK)</label><input name="total_price" type="number" min="0" step="0.01" value="0"></div><div><label>人民币金额 (CNY)</label><input name="td_cny" type="number" min="0" step="0.01" value="0" oninput="tdCalcOrder(this.form)"></div><div><label>采购汇率 (1 CNY = MMK)</label><input name="td_buy_rate" type="number" min="0" step="0.01" value="0" oninput="tdCalcOrder(this.form)"></div><div><label>客户结算汇率 (1 CNY = MMK)</label><input name="td_sell_rate" type="number" min="0" step="0.01" value="0" oninput="tdCalcOrder(this.form)"></div><div><label>汇率差额参考利润 (MMK)</label><input name="td_fx_profit" readonly value="0"></div><div><label>本站已代付 (MMK)</label><input name="advanced_amount" type="number" min="0" step="0.01" value="0"></div><div><label>服务费 (MMK)</label><input name="service_fee" type="number" min="0" step="0.01" value="0"></div><div><label>状态</label><select name="status"><option>已下单</option><option>采购中</option><option>已发货</option><option>完成</option></select></div></div><p class="muted">代买：利润以服务费为主；代付：参考汇差 = 人民币金额 ×（客户结算汇率 − 采购汇率）。汇率在保存时固定记录。总金额可手动修改。</p><label>备注（颜色、尺码、商品详情）</label><input name="notes"><div class="photo-box"><label>商品图片 / 付款凭证（最多10张）</label><input name="order_photos" type="file" accept="image/*" multiple><p class="muted">可从 iPhone 相册选择多张照片；保存订单后自动上传。客户电话和凭证仅授权账号可查看。</p></div><p><button class="primary">保存代买 / 代付</button></p></form><h2>代买 / 代付订单</h2><label>筛选类别</label><select id="orderFilter" onchange="filterOrderRows()"><option value="">全部</option><option>代买</option><option>代付</option><option>未分类</option></select><div class="scroll" style="overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch"><table style="min-width:960px;white-space:nowrap"><tr><th>类别</th><th>客户</th><th>商品</th><th>数量</th><th>总价</th><th>汇率/利润</th><th>已代付</th><th>状态</th><th>图片</th><th>管理</th></tr>${data.td_orders.filter(x=>!hiddenOrderIds.has(x.id)).map(x=>`<tr data-kind="${esc(orderType(x))}"><td>${esc(orderType(x))}</td><td>${esc(name(x.customer_id))}</td><td>${esc(x.item_name)}</td><td>${esc(x.quantity)} ${esc(x.unit)}</td><td>${money(x.total_price)}</td><td>${tdOrderProfitDisplay(x)}</td><td>${money(x.advanced_amount)}</td><td>${esc(x.status)}</td><td><button class="secondary" onclick="openOrderPhotos('${x.id}')">查看/添加图片</button></td><td>${role==='owner'?`<button class="secondary danger" onclick="deleteOrder('${x.id}')">删除</button>`:'仅管理员'}</td></tr>`).join('')}</table></div><div id="orderPhotoArea"></div>`}
function filterOrderRows(){let kind=$('orderFilter')?.value||'';document.querySelectorAll('tr[data-kind]').forEach(tr=>tr.style.display=(!kind||tr.dataset.kind===kind)?'':'none')}
async function deleteOrder(id){
 if(role!=='owner')return notify('仅管理员可删除订单',true);
 const x=data.td_orders.find(v=>v.id===id);
 if(!x)return notify('订单不存在',true);
 const linked=data.td_parcels.some(p=>p.order_id===id)||data.td_payments.some(p=>p.order_id===id);
 const question=linked
  ?'订单「'+x.item_name+'」有关联包裹或收付款。确定从业务列表移除吗？原始订单、取货和财务记录会保留，管理员操作会写入删除历史。'
  :'确定删除客户「'+name(x.customer_id)+'」的「'+x.item_name+'」订单吗？删除会记录日志，此操作不可恢复。';
 if(!confirm(question))return;
 let operation=linked?'td_owner_hide_order_v41':'td_owner_delete_order';
 let result=await db.rpc(operation,{p_order_id:id});
 if(result.error&&!linked&&/关联包裹|收付款记录/.test(result.error.message||'')){
  if(!confirm('检测到这笔订单已有相关记录，不能永久删除。是否改为从业务列表移除并保留账目？'))return;
  operation='td_owner_hide_order_v41';
  result=await db.rpc(operation,{p_order_id:id});
 }
 if(result.error)return notify('订单处理失败：'+result.error.message,true);
 notify(operation==='td_owner_hide_order_v41'?'订单已从业务列表移除，关联账目与操作历史已保留':'订单已删除，操作记录已保存；照片暂不自动清理。');
 await refresh();
}

function parcels(){return `<h2>包裹到站 / 入库</h2><form onsubmit="submitRow(event,'td_parcels')"><div class="grid"><div><label>所属客户 *</label><select name="customer_id" required>${opt(data.td_customers,x=>x.name+' '+x.phone)}</select></div><div><label>关联代购订单（可不选）</label><select name="order_id"><option value="">不关联</option>${opt(data.td_orders.filter(x=>!hiddenOrderIds.has(x.id)),x=>name(x.customer_id)+' - '+x.item_name)}</select></div><div><label>运单号</label><input name="tracking_no"></div><div><label>包裹内容</label><input name="description"></div><div><label>类别</label><input name="category" value="普通包裹"></div><div><label>到站件数 *</label><input name="pieces" type="number" min="1" step="1" required></div><div><label>总重量 (公斤)</label><input name="weight_kg" type="number" min="0" step="0.001" value="0"></div><div><label>每公斤收费 (MMK)</label><input name="fee_per_kg" type="number" min="0" step="0.01" value="0"></div><div><label>每件收费 (MMK)</label><input name="fee_per_piece" type="number" min="0" step="0.01" value="0"></div></div><label>备注</label><input name="notes"><div class="photo-box"><label>包裹照片（可拍照或从相册选择，最多10张）</label><input name="parcel_photos" type="file" accept="image/*" multiple><p class="muted">照片会在包裹入库成功后上传到云端；请等待上传完成。</p></div><p><button class="primary">确认入库</button></p></form>${listParcels(data.td_parcels)}`}
function fmtArrived(v){if(!v)return '未记录';const d=new Date(v);return Number.isNaN(d.getTime())?esc(String(v)):esc(d.toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}));}
function listParcels(ps){return `<h2>包裹清单</h2><div class="scroll"><table><tr><th>客户</th><th>运单/内容</th><th>入库时间</th><th>件数</th><th>剩余</th><th>重量</th><th>运费参考</th><th>照片</th></tr>${ps.map(x=>`<tr><td>${esc(name(x.customer_id))}</td><td>${esc(x.tracking_no)}<br>${esc(x.description)}</td><td>${fmtArrived(x.arrived_at)}</td><td>${x.pieces}</td><td><b>${x.remaining}</b></td><td>${x.weight_kg} kg</td><td>${money(Number(x.weight_kg)*Number(x.fee_per_kg)+Number(x.pieces)*Number(x.fee_per_piece))}</td><td><button class="secondary" onclick="openPhotos('${x.id}')">查看/添加照片</button></td></tr>`).join('')}</table></div><div id="photoArea"></div>`}
function parcelQuery(){return `<h2>客户包裹查询</h2><p class="muted">自动关联包裹入库与取件记录。查询只读，不会出库或收款。</p><label>搜索姓名 / 电话 / 地址</label><input id="queryTerm" placeholder="输入客户姓名、电话或地址" value="${esc(queryTerm)}" oninput="queryTerm=this.value;renderQueryResults()"><div id="queryResults"></div>`}
function renderQueryResults(){const box=$('queryResults');if(!box)return;const q=(queryTerm||'').trim().toLowerCase();if(!q){box.innerHTML='<p class="muted">请输入客户资料，查看待取和已取包裹。</p>';return;}const matches=data.td_customers.filter(c=>!c.deleted_at&&[c.name,c.phone,c.address].some(v=>String(v||'').toLowerCase().includes(q)));if(!matches.length){box.innerHTML='<p class="muted">没有找到符合条件的客户。</p>';return;}if(!matches.some(c=>c.id===queryCustomer))queryCustomer=matches[0].id;let c=data.td_customers.find(c=>c.id===queryCustomer),ps=data.td_parcels.filter(p=>p.customer_id===queryCustomer),pending=ps.reduce((a,p)=>a+Math.max(0,Number(p.remaining)||0),0),taken=ps.reduce((a,p)=>a+Math.max(0,(Number(p.pieces)||0)-(Number(p.remaining)||0)),0),pendingWeight=ps.reduce((a,p)=>{let total=Number(p.pieces)||0;return a+(total>0?(Number(p.weight_kg)||0)*Math.max(0,Number(p.remaining)||0)/total:0)},0),estimated=ps.reduce((a,p)=>{let total=Number(p.pieces)||0,remain=Math.max(0,Number(p.remaining)||0),share=total>0?remain/total:0;return a+share*((Number(p.weight_kg)||0)*(Number(p.fee_per_kg)||0)+total*(Number(p.fee_per_piece)||0))},0);let visible=ps.filter(p=>queryStatus==='all'||(queryStatus==='pending'?Number(p.remaining)>0:Number(p.pieces)>Number(p.remaining)));box.innerHTML=`<label>匹配客户（同名请核对电话）</label><select onchange="queryCustomer=this.value;renderQueryResults()">${matches.map(x=>`<option value="${esc(x.id)}" ${x.id===queryCustomer?'selected':''}>${esc(x.name)} / ${esc(x.phone||'无电话')} / ${esc(x.address||'无地址')}</option>`).join('')}</select><div class="metrics"><div class="metric">待取<b>${pending} 件</b></div><div class="metric">已取<b>${taken} 件</b></div><div class="metric">总计<b>${pending+taken} 件</b></div><div class="metric">待取参考重量<b>${money(pendingWeight)} Kg</b></div><div class="metric">待取参考运费<b>${money(estimated)} MMK</b></div></div><p class="muted">按入库登记重量和单价估算。多件合称、部分取件时，剩余重量和费用仅为按件均摊的参考值；实际运费以取件结算记录为准。</p><div class="grid"><button class="${queryStatus==='pending'?'primary':'secondary'}" onclick="queryStatus='pending';renderQueryResults()">待取</button><button class="${queryStatus==='taken'?'primary':'secondary'}" onclick="queryStatus='taken';renderQueryResults()">已取</button><button class="${queryStatus==='all'?'primary':'secondary'}" onclick="queryStatus='all';renderQueryResults()">全部</button></div><div class="scroll"><table><tr><th>类别 / 内容</th><th>运单号</th><th>入库时间</th><th>入库</th><th>待取</th><th>已取</th><th>登记重量</th><th>状态</th></tr>${visible.map(p=>{let r=Math.max(0,Number(p.remaining)||0),t=Math.max(0,(Number(p.pieces)||0)-r);return `<tr><td>${esc(p.category||'普通包裹')}<br>${esc(p.description||'')}</td><td>${esc(p.tracking_no||'—')}</td><td>${fmtArrived(p.arrived_at)}</td><td>${esc(p.pieces)}</td><td>${r}</td><td>${t}</td><td>${money(p.weight_kg)} Kg</td><td>${r===0?'已取':t>0?'部分已取':'待取'}</td></tr>`}).join('')}</table></div>${visible.length?'':'<p class="muted">此状态下暂无包裹。</p>'}<h3>该客户取件历史</h3>${pickupHistoryForCustomer(queryCustomer)}`;}
function pickupHistoryForCustomer(id){let parcelIds=new Set(data.td_parcels.filter(p=>p.customer_id===id).map(p=>p.id));let rows=data.td_pickups.filter(p=>parcelIds.has(p.parcel_id));return rows.length?`<div class="scroll"><table><tr><th>取件时间</th><th>包裹</th><th>数量</th><th>领取人</th></tr>${rows.map(r=>{let p=data.td_parcels.find(p=>p.id===r.parcel_id);return `<tr><td>${esc(date(r.picked_at))}</td><td>${esc(p?.description||p?.tracking_no||'包裹')}</td><td>${esc(r.pieces)} 件</td><td>${esc(r.receiver_name)}</td></tr>`}).join('')}</table></div><p class="muted">实际运费请在「取件」结算历史查看；同一结算单可能包含多件包裹。</p>`:'<p class="muted">暂无取件记录。</p>'}
function pickups(){let customers=data.td_customers.filter(x=>!x.deleted_at&&!archivedCustomers.has(x.id)), current=pickupCustomer||customers[0]?.id||'';pickupCustomer=current;let ps=data.td_parcels.filter(x=>x.customer_id===current&&Number(x.remaining)>0);let selected=ps.filter(x=>pickupSelected[x.id]);let pieces=selected.reduce((n,x)=>n+Number(pickupSelected[x.id]||0),0);return `<h2>客户关联 · 统一称重取件</h2><p class="muted">选择客户后自动列出待取包裹；只勾选本次取走的包裹。自动按入库重量与本次取件数量计算参考重量，也可以手动修改统一重量；商品代付款不计入运输费。</p><label>选择客户 / 搜索姓名或电话</label><input id="pickupSearch" placeholder="搜索客户姓名、电话或地址" oninput="filterPickupCustomers()"><select id="pickupCustomer" onchange="changePickupCustomer(this.value)">${opt(customers,x=>x.name+' / '+(x.phone||''))}</select><div id="pickupParcels"></div><div class="grid"><div><label>本次统一称重（Kg）*</label><input id="pickupKg" type="number" min="0.001" step="0.001" oninput="calcPickup()" placeholder="勾选包裹后自动计算，可手动修改"></div><div><label>每 Kg 运费（MMK）*</label><input id="pickupRate" type="number" min="0" step="0.01" value="7000" oninput="calcPickup()"></div><div><label>本次实收金额 (MMK) *</label><input id="pickupPaid" type="number" min="0" step="0.01" value="0" oninput="calcPickup()"><p class="muted">0 = 全部赊账；小于应收 = 自动欠款；等于应收 = 全额付清</p></div><div><label>收款方式</label><select id="pickupMethod" onchange="calcPickup()"><option>现金</option><option>KBZ Pay</option><option>AYA Pay</option><option>Wave Pay</option><option>银行转账</option><option>赊账</option></select></div><div><label>取件人姓名 *</label><input id="pickupReceiver" value="${esc(customers.find(x=>x.id===current)?.name||'')}"></div><div><label>取件人电话</label><input id="pickupPhone" value="${esc(customers.find(x=>x.id===current)?.phone||'')}"></div></div><label>备注</label><input id="pickupNotes"><div class="metric"><span>本次取件 <b id="pickupCount">0 件</b></span><span>应收运输费 <b id="pickupTotal">0 MMK</b></span><span>本次欠款 <b id="pickupDue">0 MMK</b></span></div><p><button class="primary" id="pickupSubmit" onclick="submitBatchPickup()">确认取件并记录运输费</button></p><p class="muted">需要数据库 V3.2 取件函数。部分付款自动形成欠款；取件和还款不得重复计算收入。一次确认由数据库原子扣减，避免重复出库。</p><h2>欠款与分次还款</h2><p class="muted">欠款记录读取数据库实际余额。每次还款应单独入账。</p><div id="tdDebts">加载中…</div><h2>最近统一取件结算</h2><div id="pickupHistory">加载中…</div>`}
function filterPickupCustomers(){let q=($('pickupSearch')?.value||'').trim().toLowerCase();let options=data.td_customers.filter(x=>!x.deleted_at&&!archivedCustomers.has(x.id)&&(x.name+' '+(x.phone||'')+' '+(x.address||'')).toLowerCase().includes(q));let sel=$('pickupCustomer');sel.innerHTML=opt(options,x=>x.name+' / '+(x.phone||''));if(options.length){sel.value=options.some(x=>x.id===pickupCustomer)?pickupCustomer:options[0].id;changePickupCustomer(sel.value)}else{$('pickupParcels').innerHTML='没有找到客户'}}
function changePickupCustomer(id){pickupCustomer=id;pickupSelected={};let c=data.td_customers.find(x=>x.id===id);if($('pickupReceiver'))$('pickupReceiver').value=c?.name||'';if($('pickupPhone'))$('pickupPhone').value=c?.phone||'';renderPickupParcels();tdSyncPickupWeight()}
function renderPickupParcels(){let ps=data.td_parcels.filter(x=>x.customer_id===pickupCustomer&&Number(x.remaining)>0);$('pickupParcels').innerHTML=ps.length?`<p><b>待取包裹：${ps.length} 条 / ${ps.reduce((n,x)=>n+Number(x.remaining),0)} 件</b></p>${ps.map(x=>`<div class="metric" style="margin:8px 0"><label style="display:flex;gap:10px;align-items:center"><input style="width:20px" type="checkbox" ${pickupSelected[x.id]?'checked':''} onchange="togglePickup('${x.id}',this.checked)"><b>${esc(x.description||x.tracking_no||'包裹')}</b></label><div class="muted">${esc(x.category||'普通包裹')} · 运单 ${esc(x.tracking_no||'无')} · 待取 ${x.remaining} 件 · 入库总重 ${Number(x.weight_kg)||0} Kg</div><label>本次取几件</label><input type="number" min="1" max="${Number(x.remaining)}" step="1" value="${pickupSelected[x.id]||1}" ${pickupSelected[x.id]?'':'disabled'} oninput="setPickupPieces('${x.id}',this.value)"></div>`).join('')}`:'<p class="muted">该客户目前没有待取包裹。</p>';calcPickup()}
function togglePickup(id,checked){pickupSelected[id]=checked?1:0;renderPickupParcels();tdSyncPickupWeight()}
function setPickupPieces(id,v){let x=data.td_parcels.find(p=>p.id===id);pickupSelected[id]=Math.max(1,Math.min(Number(x?.remaining||1),Math.floor(Number(v)||1)));calcPickup();tdSyncPickupWeight()}
function tdSyncPickupWeight(){const el=$('pickupKg');if(!el)return;let kg=data.td_parcels.filter(x=>x.customer_id===pickupCustomer&&pickupSelected[x.id]>0).reduce((n,x)=>{const total=Number(x.pieces)||0,part=Number(pickupSelected[x.id])||0;return n+(total>0?(Number(x.weight_kg)||0)*part/total:0)},0);el.value=kg>0?String(Number(kg.toFixed(3))):'';calcPickup()}

const PHOTO_BUCKET='tengda-images';
// 订单类别存于原有 notes 字段的前缀，避免修改线上数据库结构。
async function uploadPhotos(parcelId,files){
 if(!user)return '请先登录';
 const {data:existing,error:listError}=await db.storage.from(PHOTO_BUCKET).list(parcelId,{limit:100});
 if(listError)return '读取照片数量失败：'+listError.message;
 const count=(existing||[]).filter(x=>x.name&&!x.name.startsWith('.')).length;
 if(count+files.length>10)return `该包裹已有${count}张照片，最多10张，本次未上传`;
 let ok=0,errors=[];
 for(const file of files){
  if(!file.type.startsWith('image/')){errors.push('跳过非图片文件');continue}
  if(file.size>10*1024*1024){errors.push(file.name+' 超过10MB');continue}
  const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5)||'jpg';
  const id=crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+ok;
  const {error}=await db.storage.from(PHOTO_BUCKET).upload(`${parcelId}/${id}.${ext}`,file,{contentType:file.type,upsert:false});
  if(error)errors.push(error.message);else ok++;
 }
 return `成功上传${ok}张照片`+(errors.length?'；失败：'+errors.join('；'):'');
}

function initSign(){let c=$('sign');if(!c)return;let r=c.getBoundingClientRect();c.width=Math.max(250,Math.floor(r.width));c.height=130;let ctx=c.getContext('2d');ctx.lineWidth=2.5;ctx.lineCap='round';let down=false,strokes=[],stroke=[];const pt=e=>{let b=c.getBoundingClientRect();return [Math.round((e.clientX-b.left)*c.width/b.width),Math.round((e.clientY-b.top)*c.height/b.height)]};c.onpointerdown=e=>{down=true;stroke=[pt(e)];ctx.beginPath();ctx.moveTo(...stroke[0]);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!down)return;let p=pt(e);stroke.push(p);ctx.lineTo(...p);ctx.stroke()};c.onpointerup=()=>{if(!down)return;down=false;strokes.push(stroke);signature=JSON.stringify(strokes)};}
function clearSign(){signature='';initSign()}

 }catch(e){if(box.isConnected)box.textContent='财务数据读取失败：'+e.message}

 try{
  const rows=await tdReadBalances();if(!box.isConnected)return;
  const due=x=>Math.max(0,Number(x.due_mmk||0));
  const owing=rows.filter(x=>x.is_v32===true&&due(x)>0);
  const legacy=rows.filter(x=>x.is_v32!==true&&due(x)>0);
  const opts='<option>现金</option><option>KBZ Pay</option><option>AYA Pay</option><option>Wave Pay</option><option>银行转账</option>';
  box.innerHTML=(owing.length?'<div class="scroll"><table><tr><th>客户 / 日期</th><th>应收</th><th>已收</th><th>欠款</th><th>补款</th></tr>'+
   owing.map(x=>'<tr><td>'+esc(name(x.customer_id))+'<br>'+esc(date(x.created_at))+'</td><td>'+money(x.receivable_mmk)+'</td><td>'+money(x.paid_mmk)+'</td><td><b>'+money(due(x))+'</b></td><td><input type="number" min="0.01" step="0.01" max="'+due(x)+'" id="repay-'+x.batch_id+'" placeholder="补款金额"><select id="repay-method-'+x.batch_id+'">'+opts+'</select><button class="primary" onclick="tdRepay(\''+x.batch_id+'\','+due(x)+')">确认补款</button></td></tr>').join('')+'</table></div>':'<p class="muted">暂无 V3.2 未结清欠款。</p>')+
   (legacy.length?'<p class="muted">另有 '+legacy.length+' 笔历史单需要人工核对；为避免重复入账，不提供自动补款。</p>':'')+
   '<p class="muted">补款只对 V3.2 取件单开放，数据库会校验剩余欠款并生成独立收款流水。</p>';
 }catch(e){if(box.isConnected)box.textContent='欠款读取失败：'+e.message}
}
async function tdRepay(batch,maxDue){
 const el=$('repay-'+batch),amount=Number(el?.value),method=$('repay-method-'+batch)?.value;
 if(!Number.isFinite(amount)||amount<=0||amount>maxDue)return notify('补款金额必须大于0且不超过欠款',true);
 if(!confirm('确认收到 '+money(amount)+' MMK？提交后将生成一笔真实收款记录。'))return;
 const btn=el.closest('td')?.querySelector('button');if(btn)btn.disabled=true;
 try{
  const {error}=await db.rpc('td_pickup_repay_v32',{p_batch:batch,p_amount:amount,p_method:method,p_notes:''});
  if(error)throw error;
  notify('补款成功，已单独入账');await refresh();
 }catch(e){notify('补款失败：'+e.message,true)}
 finally{if(btn?.isConnected)btn.disabled=false}
}


// When focusing a numeric field whose default is zero, select/clear the placeholder zero.
document.addEventListener('focusin',event=>{const el=event.target;if(!(el instanceof HTMLInputElement)||el.type!=='number'||el.readOnly||el.disabled)return;if(Number(el.value)===0 && el.value.trim()!==''){el.value='';}});
