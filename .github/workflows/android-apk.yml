name: Build Teng Da Android APK
on:
  workflow_dispatch:
  push:
    branches: [android/v32-apk]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
      - 'icon-512.png'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate launcher icons
        run: |
          python3 -m pip install --user Pillow==11.3.0
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          image=Image.open("icon-512.png").convert("RGBA")
          for density,size in [("mdpi",48),("hdpi",72),("xhdpi",96),("xxhdpi",144),("xxxhdpi",192)]:
              folder=Path("android/app/src/main/res")/("mipmap-"+density)
              folder.mkdir(parents=True,exist_ok=True)
              for name in ("ic_launcher.png","ic_launcher_round.png"):
                  image.resize((size,size),Image.Resampling.LANCZOS).save(folder/name)
          PY
      - name: Build installable test APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TengDa-Express-V3.2-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
